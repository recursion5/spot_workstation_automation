---
- name: Show latest evidence path on target
  hosts: pos_workstations
  gather_facts: false
  tasks:
    - name: Latest run
      ansible.windows.win_shell: |
        Get-ChildItem 'C:\ProgramData\spot-discovery\runs' -Directory |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1 -ExpandProperty FullName
      register: latest
    - name: Path
      ansible.builtin.debug:
        var: latest.stdout
