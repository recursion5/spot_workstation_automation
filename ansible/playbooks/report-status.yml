---
- name: Report discovery staging on target
  hosts: pos_workstations
  gather_facts: false
  tasks:
    - name: List runs
      ansible.windows.win_shell: |
        Get-ChildItem 'C:\ProgramData\spot-discovery\runs' -ErrorAction SilentlyContinue |
          Select-Object Name, LastWriteTime |
          Format-Table -AutoSize | Out-String
      register: runs
    - name: Show runs
      ansible.builtin.debug:
        var: runs.stdout
