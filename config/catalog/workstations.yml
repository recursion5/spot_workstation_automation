# USB replacement menus. Operator labels are requirements.
# License pattern VGCTXssCOUNTERn (operator confirmed store number after VGCTX).
# ss = store 01/02/03. n = workstation 1/2/3.
# Zenith (03) also matches the live PCs.
schema: workstation-catalog/v1
stores:
  - id: vogue-krum
    number: 1
    menu: Vogue Krum
    workstations:
      - id: front-counter
        menu: Front Counter (cash drawer)
        role: front-counter
        spot_client_name: VGCTX01COUNTER1
        runs_spot: true
      - id: mark-in
        menu: Mark-In
        role: mark-in
        spot_client_name: VGCTX01COUNTER2
        runs_spot: true
  - id: vogue-denton
    number: 2
    menu: Vogue Denton
    workstations:
      - id: front-counter
        menu: Front Counter (cash drawer)
        role: front-counter
        spot_client_name: VGCTX02COUNTER1
        runs_spot: true
      - id: mark-in
        menu: Mark-In
        role: mark-in
        spot_client_name: VGCTX02COUNTER2
        runs_spot: true
  - id: zenith
    number: 3
    menu: Zenith
    workstations:
      - id: front-counter
        menu: Front Counter (cash drawer)
        role: front-counter
        spot_client_name: VGCTX03COUNTER1
        runs_spot: true
      - id: mark-in-1
        menu: Mark-In 1 (front mark-in)
        role: mark-in-front
        spot_client_name: VGCTX03COUNTER2
        runs_spot: true
      - id: mark-in-2
        menu: Mark-In 2 (back mark-in)
        role: mark-in-back
        spot_client_name: VGCTX03COUNTER3
        runs_spot: true
      - id: management-desk
        menu: Management desk
        role: management-desk
        spot_client_name: null
        runs_spot: false
      - id: video-wall
        menu: Video wall
        role: video-wall
        spot_client_name: null
        runs_spot: false
